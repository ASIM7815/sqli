services:
  - type: web
    name: queryquest
    runtime: python3
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 30 --access-logfile - --error-logfile - 'app:create_app()'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CTF_FLAG
        value: CTF{legacy_query_exposed_find_the_hidden_records}
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: queryquest-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
